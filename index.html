<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8fa89a">
<title>Agenda</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f5f6f4;
    color:#26332d;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:24px;
    box-shadow:0 15px 50px rgba(0,0,0,.08);
}

.logo{
    font-size:34px;
    font-weight:700;
    margin-bottom:8px;
}

.subtitle{
    color:#7a8580;
    margin-bottom:30px;
}

input,select,textarea{
    width:100%;
    border:1px solid #dfe5e1;
    background:#fafbfa;
    padding:13px 15px;
    border-radius:12px;
    outline:none;
    margin-top:7px;
    margin-bottom:15px;
}

input:focus,select:focus,textarea:focus{
    border-color:#8fa89a;
}

label{
    font-size:13px;
    font-weight:600;
}

.primary{
    width:100%;
    background:#8fa89a;
    color:white;
    padding:14px;
    border-radius:12px;
    font-weight:600;
}

.secondary{
    background:#eef2ef;
    color:#35423b;
    padding:11px 15px;
    border-radius:11px;
}

.danger{
    background:#f8e8e8;
    color:#a33d3d;
}

/* APP */

.app{
    min-height:100vh;
    padding-bottom:90px;
}

.topbar{
    background:white;
    border-bottom:1px solid #e7ebe8;
    padding:17px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:20;
}

.top-title{
    font-size:21px;
    font-weight:700;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#8fa89a;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.content{
    max-width:1050px;
    margin:auto;
    padding:25px 18px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* CARDS */

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    border:1px solid #e9edea;
}

.card-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

.welcome{
    font-size:27px;
    font-weight:700;
    margin-bottom:5px;
}

.muted{
    color:#7b8580;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.stat{
    background:white;
    border:1px solid #e9edea;
    border-radius:18px;
    padding:20px;
}

.stat-number{
    font-size:28px;
    font-weight:700;
    margin-top:5px;
}

/* CALENDAR */

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.calendar-title{
    font-size:20px;
    font-weight:700;
    text-transform:capitalize;
}

.calendar-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#eef2ef;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.weekday{
    text-align:center;
    font-size:12px;
    color:#89928d;
    padding:8px 0;
    font-weight:600;
}

.day{
    min-height:90px;
    background:#fafbfa;
    border:1px solid #edf0ee;
    border-radius:10px;
    padding:7px;
    text-align:left;
    position:relative;
}

.day:hover{
    background:#f1f5f2;
}

.day.other{
    opacity:.35;
}

.day.today{
    border:2px solid #8fa89a;
}

.day-number{
    font-size:12px;
    font-weight:700;
    margin-bottom:5px;
}

.day-event{
    font-size:10px;
    padding:3px 5px;
    border-radius:5px;
    background:#e5eee8;
    margin-top:3px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.day-event.task{
    background:#edf0f5;
}

.day-event.school{
    background:#eee9f5;
}

.day-event.work{
    background:#f4eee3;
}

.day-event.money{
    background:#e8f1ec;
}

.day-event.life{
    background:#f1e9e9;
}

/* LISTAS */

.list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.list-item{
    background:#fafbfa;
    border:1px solid #e7ebe8;
    border-radius:13px;
    padding:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.list-main{
    min-width:0;
}

.list-title{
    font-weight:600;
}

.list-info{
    font-size:12px;
    color:#7c8580;
    margin-top:3px;
}

.badge{
    padding:5px 8px;
    border-radius:7px;
    font-size:11px;
    background:#e8eee9;
}

.completed{
    text-decoration:line-through;
    opacity:.5;
}

/* BOTOES */

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.add{
    background:#8fa89a;
    color:white;
    padding:11px 15px;
    border-radius:11px;
    font-weight:600;
}

/* NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    border-top:1px solid #e4e9e5;
    height:72px;
    display:flex;
    justify-content:center;
    z-index:50;
}

.nav-inner{
    width:100%;
    max-width:650px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-btn{
    background:white;
    color:#818a85;
    font-size:11px;
}

.nav-btn.active{
    color:#607b6c;
    font-weight:700;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(30,40,35,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-box{
    background:white;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-title{
    font-size:20px;
    font-weight:700;
}

.close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#eef1ef;
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:5px;
}

.form-actions button{
    flex:1;
}

/* SETTINGS */

.theme-list{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.theme{
    width:40px;
    height:40px;
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 0 0 1px #ddd;
}

.theme.active{
    box-shadow:0 0 0 2px #333;
}

.theme[data-theme="sage"]{background:#8fa89a}
.theme[data-theme="blue"]{background:#668b91}
.theme[data-theme="softblue"]{background:#8da8bd}
.theme[data-theme="lilac"]{background:#a59bb8}
.theme[data-theme="sand"]{background:#b9a88d}
.theme[data-theme="gray"]{background:#929797}

/* RESPONSIVE */

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }

    .day{
        min-height:65px;
    }

    .day-event{
        font-size:9px;
    }

    .content{
        padding:18px 12px;
    }

    .topbar{
        padding:14px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">
    <div class="login-box">

        <div class="logo">Agenda</div>
        <div class="subtitle">A tua organização, num só lugar.</div>

        <label>Código de acesso</label>
        <input id="loginCode" type="password" placeholder="Código">

        <button class="primary" onclick="login()">Entrar</button>

        <button
            class="secondary"
            style="width:100%;margin-top:10px"
            onclick="showCreateAccount()">
            Criar conta
        </button>

        <div id="loginMessage"
             style="margin-top:15px;font-size:13px;color:#a33d3d">
        </div>

    </div>
</div>


<!-- APP -->

<div id="app" class="app hidden">

    <div class="topbar">

        <div class="top-title">Agenda</div>

        <div class="profile">
            <span id="topName"></span>
            <div id="topAvatar" class="avatar"></div>
        </div>

    </div>


    <main class="content">

        <!-- INÍCIO -->

        <section id="homePage" class="page active">

            <div class="card">

                <div id="welcomeText" class="welcome">
                    Olá
                </div>

                <div id="todayText" class="muted"></div>

            </div>


            <div class="grid">

                <div class="stat">
                    <div class="muted">Tarefas pendentes</div>
                    <div id="pendingTasks" class="stat-number">0</div>
                </div>

                <div class="stat">
                    <div class="muted">Eventos hoje</div>
                    <div id="todayEvents" class="stat-number">0</div>
                </div>

            </div>


            <div class="card" style="margin-top:18px">

                <div class="calendar-header">

                    <div id="calendarTitle" class="calendar-title"></div>

                    <div class="calendar-actions">
                        <button class="icon-btn" onclick="changeMonth(-1)">‹</button>
                        <button class="icon-btn" onclick="goToday()">Hoje</button>
                        <button class="icon-btn" onclick="changeMonth(1)">›</button>
                    </div>

                </div>

                <div id="calendar" class="calendar"></div>

            </div>

        </section>


        <!-- ESCOLA -->

        <section id="schoolPage" class="page">

            <div class="card">

                <div class="card-title">Escola</div>

                <div class="actions">
                    <button class="add" onclick="openSchoolModal()">
                        + Adicionar teste / trabalho
                    </button>
                </div>

                <div id="schoolList" class="list"></div>

            </div>

        </section>


        <!-- TRABALHO -->

        <section id="workPage" class="page">

            <div class="card">

                <div class="card-title">Trabalho</div>

                <div class="actions">
                    <button class="add" onclick="openWorkModal()">
                        + Adicionar
                    </button>
                </div>

                <div id="workList" class="list"></div>

            </div>

        </section>


        <!-- DEFINIÇÕES -->

        <section id="settingsPage" class="page">

            <div class="card">

                <div class="card-title">Perfil</div>

                <label>Nome</label>
                <input id="settingsName">

                <button class="primary" onclick="saveName()">
                    Guardar nome
                </button>

            </div>


            <div class="card">

                <div class="card-title">Tema</div>

                <div class="theme-list">

                    <button class="theme" data-theme="sage"
                        onclick="setTheme('sage')"></button>

                    <button class="theme" data-theme="blue"
                        onclick="setTheme('blue')"></button>

                    <button class="theme" data-theme="softblue"
                        onclick="setTheme('softblue')"></button>

                    <button class="theme" data-theme="lilac"
                        onclick="setTheme('lilac')"></button>

                    <button class="theme" data-theme="sand"
                        onclick="setTheme('sand')"></button>

                    <button class="theme" data-theme="gray"
                        onclick="setTheme('gray')"></button>

                </div>

            </div>


            <div class="card">

                <div class="card-title">Sessão</div>

                <button
                    class="secondary"
                    style="width:100%"
                    onclick="logout()">
                    Terminar sessão
                </button>

            </div>

        </section>


    </main>


    <!-- NAV -->

    <nav class="bottom-nav">

        <div class="nav-inner">

            <button
                class="nav-btn active"
                data-page="homePage"
                onclick="openPage('homePage')">
                Início
            </button>

            <button
                class="nav-btn"
                data-page="schoolPage"
                onclick="openPage('schoolPage')">
                Escola
            </button>

            <button
                class="nav-btn"
                data-page="workPage"
                onclick="openPage('workPage')">
                Trabalho
            </button>

            <button
                class="nav-btn"
                data-page="settingsPage"
                onclick="openPage('settingsPage')">
                Definições
            </button>

        </div>

    </nav>

</div>


<!-- MODAL -->

<div id="modal" class="modal hidden">
    <div id="modalContent" class="modal-box"></div>
</div>


<script>

/* =========================================================
   DADOS
========================================================= */

let accounts = JSON.parse(
    localStorage.getItem("agenda_accounts") || "[]"
);

let currentUserId =
    localStorage.getItem("agenda_current_user") || null;

let user = null;

let calendarDate = new Date();


/* =========================================================
   UTILIDADES
========================================================= */

function uid(){
    return Date.now().toString(36) +
           Math.random().toString(36).substring(2,8);
}

function today(){

    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");
}

function formatDate(date){

    if(!date) return "";

    const parts = date.split("-");

    if(parts.length !== 3) return date;

    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   CONTA
========================================================= */

function createDefaultAccounts(){

    if(accounts.length > 0) return;

    accounts = [

        {
            id:"guilherme",
            name:"Guilherme",
            code:"1212",
            theme:"sage",

            tasks:[],
            events:[],
            money:[],
            life:[],
            school:[],
            work:[]
        },

        {
            id:"test",
            name:"Utilizador",
            code:"2020",
            theme:"blue",

            tasks:[],
            events:[],
            money:[],
            life:[],
            school:[],
            work:[]
        }

    ];

    saveAccounts();
}

function saveAccounts(){

    localStorage.setItem(
        "agenda_accounts",
        JSON.stringify(accounts)
    );
}

function normalizeUser(){

    if(!user) return;

    if(!Array.isArray(user.tasks))
        user.tasks=[];

    if(!Array.isArray(user.events))
        user.events=[];

    if(!Array.isArray(user.money))
        user.money=[];

    if(!Array.isArray(user.life))
        user.life=[];

    if(!Array.isArray(user.school))
        user.school=[];

    if(!Array.isArray(user.work))
        user.work=[];

    if(!user.name)
        user.name="Utilizador";

    if(!user.theme)
        user.theme="sage";

    saveUser();
}

function saveUser(){

    if(!user) return;

    const index =
        accounts.findIndex(a => a.id === user.id);

    if(index !== -1){

        accounts[index] = user;

        saveAccounts();

    }
}


/* =========================================================
   LOGIN
========================================================= */

function login(){

    const code =
        document.getElementById("loginCode").value.trim();

    const found =
        accounts.find(a => a.code === code);

    if(!found){

        document.getElementById("loginMessage").textContent =
            "Código de acesso inválido.";

        return;
    }

    user = found;

    currentUserId = user.id;

    localStorage.setItem(
        "agenda_current_user",
        user.id
    );

    normalizeUser();

    openApp();
}

function openApp(){

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    updateProfile();

    renderAll();

    openPage("homePage");
}

function logout(){

    localStorage.removeItem("agenda_current_user");

    user = null;

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    document.getElementById("loginCode").value="";
}

function showCreateAccount(){

    openModal(`
        <div class="modal-header">
            <div class="modal-title">Criar conta</div>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <label>Nome</label>
        <input id="newName">

        <label>Código de acesso</label>
        <input id="newCode" type="password">

        <div class="form-actions">

            <button class="secondary"
                    onclick="closeModal()">
                Cancelar
            </button>

            <button class="primary"
                    onclick="createAccount()">
                Criar
            </button>

        </div>
    `);
}

function createAccount(){

    const name =
        document.getElementById("newName").value.trim();

    const code =
        document.getElementById("newCode").value.trim();

    if(!name || !code){

        alert("Preenche todos os campos.");

        return;
    }

    if(accounts.some(a => a.code === code)){

        alert("Esse código já está a ser utilizado.");

        return;
    }

    const newAccount = {

        id:uid(),
        name:name,
        code:code,
        theme:"sage",

        tasks:[],
        events:[],
        money:[],
        life:[],
        school:[],
        work:[]
    };

    accounts.push(newAccount);

    saveAccounts();

    closeModal();

    alert("Conta criada.");

}


/* =========================================================
   PERFIL / TEMA
========================================================= */

function updateProfile(){

    document.getElementById("topName").textContent =
        user.name;

    document.getElementById("welcomeText").textContent =
        "Olá, " + user.name;

    document.getElementById("todayText").textContent =
        new Date().toLocaleDateString(
            "pt-PT",
            {
                weekday:"long",
                day:"numeric",
                month:"long"
            }
        );

    document.getElementById("settingsName").value =
        user.name;

    applyTheme(user.theme);
}

function saveName(){

    const name =
        document.getElementById("settingsName").value.trim();

    if(!name) return;

    user.name=name;

    saveUser();

    updateProfile();
}

function setTheme(theme){

    user.theme=theme;

    saveUser();

    applyTheme(theme);
}

function applyTheme(theme){

    const themes={

        sage:"#8fa89a",
        blue:"#668b91",
        softblue:"#8da8bd",
        lilac:"#a59bb8",
        sand:"#b9a88d",
        gray:"#929797"

    };

    document.documentElement.style.setProperty(
        "--theme",
        themes[theme] || themes.sage
    );

    document
        .querySelectorAll(".theme")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.theme === theme
            );

        });
}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function openPage(page){

    document
        .querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));

    const target =
        document.getElementById(page);

    if(target)
        target.classList.add("active");

    document
        .querySelectorAll(".nav-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.page === page
            );

        });

}


/* =========================================================
   MODAL
========================================================= */

function openModal(html){

    document.getElementById("modalContent").innerHTML =
        html;

    document
        .getElementById("modal")
        .classList.remove("hidden");
}

function closeModal(){

    document
        .getElementById("modal")
        .classList.add("hidden");
}


/* =========================================================
   CALENDÁRIO
========================================================= */

function changeMonth(amount){

    calendarDate.setMonth(
        calendarDate.getMonth()+amount
    );

    renderCalendar();
}

function goToday(){

    calendarDate = new Date();

    renderCalendar();
}

function dateKey(date){

    return date.getFullYear() + "-" +
        String(date.getMonth()+1).padStart(2,"0") + "-" +
        String(date.getDate()).padStart(2,"0");
}


/*
    ESTA É A PARTE MAIS IMPORTANTE:

    O calendário NÃO guarda acontecimentos.

    Ele vai buscar os acontecimentos diretamente
    às tarefas, eventos, escola, trabalho, finanças e Vida.
*/

function getCalendarItems(){

    const result=[];

    /* TAREFAS */

    user.tasks.forEach(item => {

        if(!item.date) return;

        result.push({

            id:item.id,
            date:item.date,
            title:item.title,
            type:"task"

        });

    });


    /* EVENTOS */

    user.events.forEach(item => {

        if(!item.date) return;

        result.push({

            id:item.id,
            date:item.date,
            title:item.title,
            type:"event"

        });

    });


    /* ESCOLA */

    user.school.forEach(item => {

        if(!item.date) return;

        result.push({

            id:item.id,
            date:item.date,
            title:"Escola: " + item.subject,
            type:"school"

        });

    });


    /* TRABALHO */

    user.work.forEach(item => {

        if(!item.date) return;

        result.push({

            id:item.id,
            date:item.date,
            title:"Trabalho: " + item.title,
            type:"work"

        });

    });


    /* FINANÇAS */

    user.money.forEach(item => {

        if(!item.date) return;

        result.push({

            id:item.id,
            date:item.date,
            title:
                (item.type === "income" ? "+" : "-") +
                item.amount + "€",
            type:"money"

        });

    });


    /* VIDA */

    user.life.forEach(item => {

        if(!item.date) return;

        result.push({

            id:item.id,
            date:item.date,
            title:item.title,
            type:"life"

        });

    });

    return result;
}


function renderCalendar(){

    const calendar =
        document.getElementById("calendar");

    const title =
        document.getElementById("calendarTitle");

    if(!calendar || !user) return;

    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();

    title.textContent =
        new Date(year,month,1).toLocaleDateString(
            "pt-PT",
            {
                month:"long",
                year:"numeric"
            }
        );

    calendar.innerHTML="";


    const weekdays=[
        "Seg",
        "Ter",
        "Qua",
        "Qui",
        "Sex",
        "Sáb",
        "Dom"
    ];

    weekdays.forEach(day => {

        const el =
            document.createElement("div");

        el.className="weekday";

        el.textContent=day;

        calendar.appendChild(el);

    });


    /*
       JS começa a semana no Domingo.
       Aqui convertemos para Segunda-feira.
    */

    let firstDay =
        new Date(year,month,1).getDay();

    firstDay =
        firstDay === 0 ? 6 : firstDay-1;

    const daysInMonth =
        new Date(year,month+1,0).getDate();

    const previousMonthDays =
        new Date(year,month,0).getDate();

    const items =
        getCalendarItems();

    for(let i=0;i<42;i++){

        const dayNumber =
            i-firstDay+1;

        let cellDate;
        let other=false;

        if(dayNumber < 1){

            cellDate =
                new Date(
                    year,
                    month-1,
                    previousMonthDays+dayNumber
                );

            other=true;

        }
        else if(dayNumber > daysInMonth){

            cellDate =
                new Date(
                    year,
                    month+1,
                    dayNumber-daysInMonth
                );

            other=true;

        }
        else{

            cellDate =
                new Date(
                    year,
                    month,
                    dayNumber
                );

        }

        const key =
            dateKey(cellDate);

        const cell =
            document.createElement("button");

        cell.className="day";

        if(other)
            cell.classList.add("other");

        if(key === today())
            cell.classList.add("today");

        cell.innerHTML =
            `<div class="day-number">${cellDate.getDate()}</div>`;

        const dayItems =
            items.filter(item => item.date === key);

        dayItems.slice(0,4).forEach(item => {

            const event =
                document.createElement("div");

            event.className =
                "day-event " + item.type;

            event.textContent =
                item.title;

            cell.appendChild(event);

        });

        if(dayItems.length > 4){

            const more =
                document.createElement("div");

            more.className="day-event";

            more.textContent =
                "+" + (dayItems.length-4);

            cell.appendChild(more);

        }

        cell.onclick = () =>
            showDay(key);

        calendar.appendChild(cell);

    }

}


/* =========================================================
   DIA DO CALENDÁRIO
========================================================= */

function showDay(date){

    const items =
        getCalendarItems()
            .filter(item => item.date === date);

    let html=`

        <div class="modal-header">

            <div class="modal-title">
                ${formatDate(date)}
            </div>

            <button class="close"
                    onclick="closeModal()">
                ×
            </button>

        </div>
    `;

    if(items.length===0){

        html += `
            <p class="muted">
                Não há nada marcado para este dia.
            </p>
        `;

    }
    else{

        html += `<div class="list">`;

        items.forEach(item => {

            html += `
                <div class="list-item">

                    <div class="list-main">

                        <div class="list-title">
                            ${escapeHTML(item.title)}
                        </div>

                        <div class="list-info">
                            ${item.type}
                        </div>

                    </div>

                </div>
            `;

        });

        html += `</div>`;

    }

    openModal(html);
}

function renderAll(){

    normalizeUser();

    renderHome();

    renderCalendar();

    renderSchool();

    renderWork();

}

function renderHome(){

    const pending =
        user.tasks.filter(
            task => !task.completed
        ).length;

    document.getElementById("pendingTasks")
        .textContent=pending;

    const todayCount =
        getCalendarItems()
            .filter(item => item.date === today())
            .length;

    document.getElementById("todayEvents")
        .textContent=todayCount;
}

function renderSchool(){

    const container =
        document.getElementById("schoolList");

    if(user.school.length===0){

        container.innerHTML =
            `<div class="muted">
                Ainda não tens registos escolares.
             </div>`;

        return;
    }

    container.innerHTML =
        user.school
            .slice()
            .sort((a,b) =>
                a.date.localeCompare(b.date)
            )
            .map(item => `

                <div class="list-item">

                    <div class="list-main">

                        <div class="list-title">
                            ${escapeHTML(item.subject)}
                        </div>

                        <div class="list-info">
                            ${escapeHTML(item.type)}
                            · ${formatDate(item.date)}
                            ${item.time ? " · "+item.time : ""}
                        </div>

                    </div>

                    <div class="badge">
                        ${escapeHTML(item.type)}
                    </div>

                </div>

            `)
            .join("");
}
