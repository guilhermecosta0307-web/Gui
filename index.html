<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gui</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .app {
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            padding: 25px 20px 100px;
        }

        header {
            margin-bottom: 30px;
        }

        .greeting {
            font-size: 15px;
            color: #777;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
        }

        .date {
            margin-top: 7px;
            color: #777;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-text {
            color: #777;
            font-size: 14px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        button {
            border: none;
            background: white;
            border-radius: 18px;
            padding: 22px 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        button:active {
            transform: scale(0.97);
        }

        .icon {
            display: block;
            font-size: 25px;
            margin-bottom: 8px;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #eee;
        }

        nav button {
            box-shadow: none;
            background: transparent;
            padding: 5px 15px;
            font-size: 12px;
        }

        nav .icon {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="greeting">Bem-vindo</div>
        <h1>Gui</h1>
        <div class="date" id="date"></div>
    </header>

    <div class="card">
        <div class="card-title">Hoje</div>
        <div class="card-text">
            Tens tudo organizado por aqui.
        </div>
    </div>

    <div class="card">
        <div class="card-title">A minha organização</div>

        <div class="buttons">

            <button onclick="alert('Aqui vamos colocar as tuas tarefas.')">
                <span class="icon">✓</span>
                Tarefas
            </button>

            <button onclick="alert('Aqui vamos colocar o teu calendário.')">
                <span class="icon">□</span>
                Agenda
            </button>

            <button onclick="alert('Aqui vamos colocar as tuas notas.')">
                <span class="icon">✎</span>
                Notas
            </button>

            <button onclick="alert('Aqui vamos colocar os teus objetivos.')">
                <span class="icon">☆</span>
                Objetivos
            </button>

        </div>
    </div>

</div>

<nav>
    <button>
        <span class="icon">⌂</span>
        Início
    </button>

    <button>
        <span class="icon">✓</span>
        Tarefas
    </button>

    <button>
        <span class="icon">⚙</span>
        Definições
    </button>
</nav>

<script>

    const hoje = new Date();

    const dataFormatada = hoje.toLocaleDateString(
        "pt-PT",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

    document.getElementById("date").textContent = dataFormatada;

</script>

</body>
</html>
